path id="patches" d="" fill="#d7a0a2" stroke="none"/><ellipse cx="120" cy="130" rx="39" ry="27" fill="#f7ddc3" stroke="none"/><circle cx="91" cy="103" r="7" fill="#332522" stroke="none"/><circle cx="148" cy="103" r="7" fill="#332522" stroke="none"/><ellipse cx="120" cy="123" rx="7" ry="5" fill="#69463c" stroke="none"/><path d="M110 138 Q120 150 130 138" fill="none" stroke-width="3"/><ellipse cx="70" cy="128" rx="12" ry="7" fill="#f4a5b3" stroke="none"/><ellipse cx="170" cy="128" rx="12" ry="7" fill="#f4a5b3" stroke="none"/></g><g id="scarf" style="display:none" stroke="#a55e7a" stroke-width="3"><path d="M70 153 Q120 178 170 153 L163 174 Q120 194 78 174 Z" fill="#f5a7c7"/><path d="M153 172 L180 206 L163 212 L137 182" fill="#f5a7c7"/></g><g id="apron" style="display:none" stroke="#a55e7a" stroke-width="3"><path d="M94 159 L146 159 L158 225 Q120 243 82 225 Z" fill="#ffe4ed"/><path d="M101 193 Q120 206 139 193" fill="none"/></g><g id="hat" style="display:none" stroke="#a55e7a" stroke-width="3"><path d="M81 57 Q63 27 90 19 Q120 -4 145 19 Q174 24 160 57 Z" fill="#fff"/><rect x="80" y="51" width="80" height="16" rx="7" fill="#f5a7c7"/></g><g id="bow" style="display:none" stroke="#a55e7a" stroke-width="3"><path d="M154 63 Q180 34 188 64 Q195 89 162 73 Q137 93 139 66 Q144 49 154 63 Z" fill="#f5a7c7"/><circle cx="160" cy="68" r="7" fill="#fff0f6"/></g></svg><p class="foot">Both animals use the same separate clothing layers. Tap an option to change the outfit.</p></section><p><a href="./index.html">Original character lab v0.1</a></p></main><script>const $=id=>document.getElementById(id);function update(){let cat=$('species').value==='cat';$('torso').setAttribute('fill',cat?'#fff9f4':'#dca778');$('face').setAttribute('fill',cat?'#fff9f4':'#dca778');$('tail').setAttribute('stroke',cat?'#a9a1ad':'#c58b65');$('leftpaw').setAttribute('fill',cat?'#fff9f4':'#c58b65');$('rightpaw').setAttribute('fill',cat?'#fff9f4':'#c58b65');$('ears').innerHTML=cat?'<path d="M49 79 L57 25 L97 53 M143
