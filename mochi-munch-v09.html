<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mochi Munch v0.9</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff3f7;color:#634455;font:16px system-ui}header{background:#ffe1ec;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}h1{font-size:1.4rem;margin:0}main{max-width:940px;margin:16px auto;padding:0 14px}.panel{background:white;border:3px solid #e8b7c8;border-radius:20px;padding:18px;min-height:420px}.hidden{display:none}.room{height:320px;position:relative;overflow:hidden;background:linear-gradient(#ffe3ed 0 70%,#e2c2a9 70%);border-radius:16px}.window{position:absolute;top:30px;left:35px;width:135px;height:120px;background:#bce8fc;border:10px solid white;border-radius:15px}.counter{position:absolute;right:5%;bottom:12px;width:40%;height:95px;background:#f4b4ca;border:6px solid #ba7b93;border-radius:14px;text-align:center;padding-top:20px;font-weight:700}.bench{position:absolute;left:17%;bottom:42px;width:140px;height:55px;border-radius:16px;background:#e6a9be;border:5px solid #b37c90}.animal{position:absolute;bottom:78px;left:10%;width:86px;height:116px;transition:left 1.1s ease-in-out,bottom 1.1s ease-in-out;filter:drop-shadow(0 4px 2px #0002)}.animal.walk svg{animation:bob .25s infinite alternate}@keyframes bob{to{transform:translateY(-5px) rotate(2deg)}}.animal svg{width:100%;height:100%}.queue{display:flex;gap:12px;align-items:center;margin:12px 0}.queue span{font-size:26px}button,select{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid #d69eb2;background:#ffdfeb;color:#634455;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.ingredients{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}.ingredients button{background:#fff7fa}.bowl{border:3px dashed #d6a2b5;background:#fff8fb;border-radius:15px;text-align:center;padding:20px;min-height:95px}.status{background:white;border-radius:13px;padding:12px;margin-top:14px}.food{text-align:center;font-size:72px}.stars{font-size:30px;color:#e6a52f;text-align:center}#serveView{text-align:center}.small{font-size:.85rem;color:#856b77}</style></head><body><header><h1>🍓 Mochi Munch <small style="font-size:.65em;font-weight:600">Version 0.9</small></h1><strong id="coins">🪙 0</strong></header><main><section id="cafe" class="panel"><h2>Café</h2><div class="room"><div class="window"></div><div class="bench"></div><div class="counter">COUNTER</div><div id="animal" class="animal"></div></div><div class="queue" id="queue"></div><p id="customerMessage"></p><div class="actions"><button id="approach">Call customer to counter</button><button id="goKitchen">Go to Kitchen</button><button id="serve">Serve prepared food</button><button id="next">Next customer</button></div></section><section id="kitchen" class="panel hidden"><h2>Kitchen</h2><p>Choose up to four ingredients. Tap or drag them into the bowl.</p><div class="ingredients" id="ingredients"></div><div class="bowl" id="bowl"><strong>🥣 Mixing bowl</strong><p id="selected">Empty</p></div><div class="actions"><button id="clear">Empty bowl</button><button id="mix">Mix</button><button id="bake">Bake</button><button id="return">Back to Café</button></div></section><section id="serveView" class="panel hidden"><h2 id="resultTitle"></h2><div id="foodIcon" class="food"></div><p id="reaction"></p><div id="stars" class="stars"></div><h2 id="reward"></h2><button id="finish">Return to café</button></section><p id="status" class="status" role="status" aria-live="polite">Welcome to Mochi Munch!</p><p class="small">Development build: customer movement, queue, kitchen, ratings and saving are integrated. Graphics are placeholders.</p></main><script type="module">
import {Game,STATES,resolveRecipe} from './src/game-core.js';
const $=id=>document.getElementById(id),game=new Game(),icons={cat:'🐱',capybara:'🦫'},ingredients=[['strawberry','🍓'],['blueberry','🫐'],['banana','🍌'],['flour','🌾'],['sugar','🍬'],['milk','🥛']],rewards={1:1,2:5,3:10,4:15,5:20};let queue=[],current=null,chosen=[],prepared=null,phase='waiting',busy=false,served=0;
try{const data=JSON.parse(localStorage.getItem('mochi-munch-v09')||'null');if(data?.version===1){game.coins=Math.max(0,Math.floor(data.coins)||0);served=Math.max(0,Math.floor(data.served)||0)}}catch{}
function save(){try{localStorage.setItem('mochi-munch-v09',JSON.stringify({version:1,coins:game.coins,served}))}catch{}}
function show(id){for(const name of ['cafe','kitchen','serveView'])$(name).classList.toggle('hidden',name!==id)}
function msg(t){$('status').textContent=t}
function species(){return Math.random()<.5?'cat':'capybara'}
function newCustomer(){return{id:'guest-'+Math.random().toString(36).slice(2),species:species(),outfit:'none',headwear:'none',preference:Math.random()<.5?'fruit':'baked'}}
function replenish(){while(queue.length<3)queue.push(newCustomer())}
function face(){if(!current)return'';const cat=current.species==='cat',fur=cat?'#fff8f1':'#d9a575';return '<svg viewBox="0 0 110 145" aria-label="'+current.species+'" role="img"><g stroke="#725043" stroke-width="3" stroke-linejoin="round"><ellipse cx="55" cy="105" rx="35" ry="36" fill="'+fur+'"/><ellipse cx="35" cy="129" rx="12" ry="13" fill="'+fur+'"/><ellipse cx="75" cy="129" rx="12" ry="13" fill="'+fur+'"/>'+(cat?'<path d="M10 52 L17 10 L40 28 L70 28 L95 10 L101 52" fill="'+fur+'"/>':'<circle cx="20" cy="48" r="14" fill="#c18a61"/><circle cx="90" cy="48" r="14" fill="#c18a61"/>')+'<ellipse cx="55" cy="65" rx="48" ry="42" fill="'+fur+'"/>'+(cat?'<path d="M11 44 Q24 25 46 28 L52 46 Z" fill="#e9a56d" stroke="none"/><path d="M67 28 Q91 26 101 49 L80 51 Z" fill="#a4a0ae" stroke="none"/>':'')+'<ellipse cx="55" cy="80" rx="23" ry="16" fill="#f7ddc4" stroke="none"/><circle cx="37" cy="61" r="4" fill="#342722" stroke="none"/><circle cx="73" cy="61" r="4" fill="#342722" stroke="none"/><ellipse cx="55" cy="75" rx="5" ry="4" fill="#725043" stroke="none"/><path d="M48 85 Q55 93 62 85" fill="none" stroke-width="2"/></g></svg>'}
function render(){replenish();$('coins').textContent='🪙 '+game.coins;$('animal').innerHTML=face();$('queue').innerHTML='<strong>Waiting:</strong> '+queue.map(c=>icons[c.species]).join(' ');$('customerMessage').textContent=!current?'Choose a customer.':phase==='waiting'?'Your '+current.species+' is waiting.':phase==='approaching'?'Walking to the counter…':phase==='counter'?'The customer is ready for a surprise dish!':phase==='prepared'?'Food is ready. Serve it!':'Customer finished eating.';$('approach').disabled=busy||phase!=='waiting';$('goKitchen').disabled=busy||!['counter','prepared'].includes(phase);$('serve').disabled=busy||phase!=='prepared';$('next').disabled=busy||phase!=='finished';$('selected').textContent=chosen.length?chosen.map(x=>ingredients.find(i=>i[0]===x)[1]+' '+x).join(' + '):'Empty';$('mix').disabled=$('bake').disabled=!chosen.length}
function start(){current=queue.shift();replenish();phase='waiting';chosen=[];prepared=null;const a=$('animal');a.style.transition='none';a.style.left='12%';a.style.bottom='78px';a.classList.remove('walk');render();msg('A '+current.species+' has arrived.')}
function move(x,bottom,callback){busy=true;const a=$('animal');a.classList.add('walk');a.style.transition='none';a.getBoundingClientRect();a.style.transition='left 1.1s ease-in-out,bottom 1.1s ease-in-out';a.style.left=x;a.style.bottom=bottom;render();setTimeout(()=>{a.classList.remove('walk');busy=false;callback();render()},1150)}
$('approach').onclick=()=>{if(phase!=='waiting'||busy)return;phase='approaching';move('57%','78px',()=>{phase='counter';msg('Customer is at the counter. Go to the kitchen!')})};
$('goKitchen').onclick=()=>{if(!['counter','prepared'].includes(phase))return;show('kitchen');msg('Make something for your customer.')};
$('return').onclick=()=>{show('cafe');render()};
for(const [id,emoji] of ingredients){const b=document.createElement('button');b.textContent=emoji+' '+id;b.draggable=true;b.onclick=()=>add(id);b.ondragstart=e=>e.dataTransfer.setData('text/plain',id);$('ingredients').append(b)}
$('bowl').ondragover=e=>e.preventDefault();$('bowl').ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(ingredients.some(i=>i[0]===id))add(id)};
function add(id){if(chosen.length>=4){msg('Four ingredients maximum.');return}chosen.push(id);render();msg('Added '+id)}
$('clear').onclick=()=>{chosen=[];render()};
function cook(method){if(!chosen.length)return;const r=resolveRecipe(chosen,method);const fruit=chosen.some(x=>['strawberry','blueberry','banana'].includes(x));const baked=method==='bake';let stars=r.quality;stars+=current.preference==='fruit'&&fruit&&!baked?1:0;stars+=current.preference==='baked'&&baked?1:0;stars-=current.preference==='fruit'&&baked?1:0;stars=Math.max(1,Math.min(5,stars));prepared={...r,stars,emoji:r.id.includes('smoothie')?'🥤':r.id.includes('muffin')?'🧁':r.id.includes('cookie')?'🍪':baked?'🥧':'🥣'};phase='prepared';show('cafe');render();msg(prepared.name+' is ready. Serve it!')}
$('mix').onclick=()=>cook('mix');$('bake').onclick=()=>cook('bake');
$('serve').onclick=()=>{if(phase!=='prepared')return;const n=prepared.stars,coins=rewards[n];game.awardCoins(coins,'customer rating');served++;save();$('resultTitle').textContent=prepared.name;$('foodIcon').textContent=prepared.emoji;$('stars').textContent='★'.repeat(n)+'☆'.repeat(5-n);$('reaction').textContent=(n>=4?'Delicious! ':n===3?'Pretty good. ':'What a surprise! ')+ 'The '+current.species+' gives '+n+' stars.';$('reward').textContent='+'+coins+' coins';phase='finished';show('serveView');render();msg('Customer served! '+served+' customers total.')};
$('finish').onclick=()=>{show('cafe');render()};$('next').onclick=()=>{if(phase!=='finished'||busy)return;move('95%','78px',()=>{start()})};
start();show('cafe');
</script></body></html>
