<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mochi Munch Character Lab 0.3</title><style>body{font-family:system-ui;background:#fff0f5;color:#614153;text-align:center}main{max-width:850px;margin:auto}section{background:#fff;border:3px solid #edb8cb;border-radius:22px;padding:18px;margin:14px}button,select{font:inherit;padding:10px;border-radius:12px;border:2px solid #d99fb3;background:#ffe0ec;margin:5px}svg{width:min(90%,340px);height:350px;touch-action:none;overflow:visible}#character{transform-origin:50% 85%}#character.walk{animation:walk .48s ease-in-out infinite alternate}#character.sleep{animation:sleep 2.4s ease-in-out infinite}#character.eat{animation:eat .55s ease-in-out infinite alternate}#character.sit{transform:translateY(22px) scaleY(.82)}@keyframes walk{from{transform:translate(-8px,-4px) rotate(-3deg)}to{transform:translate(8px,0) rotate(3deg)}}@keyframes sleep{50%{transform:translateY(7px) rotate(2deg)}}@keyframes eat{to{transform:translateY(4px) scaleY(.96)}}.row{display:flex;justify-content:center;flex-wrap:wrap}label{display:inline-block;margin:8px}#character{filter:drop-shadow(0 5px 3px #0002)}.foot{font-size:13px;color:#856879}</style></head><body><main><h1>🍓 Mochi Munch — Character Lab v0.3</h1><section><div class="row"><label>Customer <select id="species"><option value="capybara">Capybara</option><option value="cat">Calico cat</option></select></label><label>Clothes <select id="outfit"><option value="none">None</option><option value="scarf">Pink scarf</option><option value="apron">Apron</option></select></label><label>Headwear <select id="headwear"><option value="none">None</option><option value="hat">Chef hat</option><option value="bow">Bow</option></select></label></div><div class="row"><label>Action <select id="action"><option value="idle">Standing</option><option value="walk">Walking</option><option value="sit">Sitting</option><option value="eat">Eating</option><option value="sleep">Sleeping</option></select></label><label>Expression <select id="expression"><option value="happy">Happy</option><option value="surprised">Surprised</option><option value="sleepy">Sleepy</option></select></label></div><svg id="character" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg"><g id="figure" stroke="#69463c" stroke-width="4" stroke-linejoin="round"><path id="tail" d="M163 182 Q217 181 193 151" fill="none" stroke="#c58b65" stroke-width="17"/><ellipse id="torso" cx="120" cy="181" rx="57" ry="62" fill="#dca778"/><ellipse cx="120" cy="185" rx="30" ry="38" fill="#f7ddc3" stroke="none"/><ellipse id="leftpaw" cx="82" cy="229" rx="18" ry="12" fill="#c58b65"/><ellipse id="rightpaw" cx="159" cy="229" rx="18" ry="12" fill="#c58b65"/><g id="ears"><circle cx="69" cy="66" r="20" fill="#c58b65"/><circle cx="171" cy="66" r="20" fill="#c58b65"/></g><ellipse id="face" cx="120" cy="105" rx="76" ry="67" fill="#dca778"/><path id="patches" d="" fill="#d7a0a2" stroke="none"/><ellipse cx="120" cy="130" rx="39" ry="27" fill="#f7ddc3" stroke="none"/><circle id="eyeL" cx="91" cy="103" r="7" fill="#332522" stroke="none"/><circle id="eyeR" cx="148" cy="103" r="7" fill="#332522" stroke="none"/><ellipse cx="120" cy="123" rx="7" ry="5" fill="#69463c" stroke="none"/><path id="mouth" d="M110 138 Q120 150 130 138" fill="none" stroke-width="3"/><ellipse cx="70" cy="128" rx="12" ry="7" fill="#f4a5b3" stroke="none"/><ellipse cx="170" cy="128" rx="12" ry="7" fill="#f4a5b3" stroke="none"/></g><g id="food" style="display:none"><ellipse cx="171" cy="151" rx="19" ry="13" fill="#f3c58e" stroke="#a97850" stroke-width="3"/><circle cx="164" cy="148" r="5" fill="#e58c9b"/><circle cx="176" cy="154" r="4" fill="#e58c9b"/></g><g id="scarf" style="display:none" stroke="#a55e7a" stroke-width="3"><path d="M70 153 Q120 178 170 153 L163 174 Q120 194 78 174 Z" fill="#f5a7c7"/><path d="M153 172 L180 206 L163 212 L137 182" fill="#f5a7c7"/></g><g id="apron" style="display:none" stroke="#a55e7a" stroke-width="3"><path d="M94 159 L146 159 L158 225 Q120 243 82 225 Z" fill="#ffe4ed"/><path d="M101 193 Q120 206 139 193" fill="none"/></g><g id="hat" style="display:none" stroke="#a55e7a" stroke-width="3"><path d="M81 57 Q63 27 90 19 Q120 -4 145 19 Q174 24 160 57 Z" fill="#fff"/><rect x="80" y="51" width="80" height="16" rx="7" fill="#f5a7c7"/></g><g id="bow" style="display:none" stroke="#a55e7a" stroke-width="3"><path d="M154 63 Q180 34 188 64 Q195 89 162 73 Q137 93 139 66 Q144 49 154 63 Z" fill="#f5a7c7"/><circle cx="160" cy="68" r="7" fill="#fff0f6"/></g></svg><p class="foot">The same clothing follows both characters through five actions. Animations are simple prototype motions, not final frame-by-frame artwork.</p></section><p><a href="./index.html">Original character lab v0.1</a></p></main><script>const $=id=>document.getElementById(id);function update(){let cat=$('species').value==='cat';$('torso').setAttribute('fill',cat?'#fff9f4':'#dca778');$('face').setAttribute('fill',cat?'#fff9f4':'#dca778');$('tail').setAttribute('stroke',cat?'#a9a1ad':'#c58b65');$('leftpaw').setAttribute('fill',cat?'#fff9f4':'#c58b65');$('rightpaw').setAttribute('fill',cat?'#fff9f4':'#c58b65');$('ears').innerHTML=cat?'<path d="M49 79 L57 25 L97 53 M143 53 L183 25 L191 79" fill="#fff9f4"/><path d="M61 38 L66 65 L87 53 M174 38 L169 65 L153 53" fill="#f7bdc9" stroke="none"/>':'<circle cx="69" cy="66" r="20" fill="#c58b65"/><circle cx="171" cy="66" r="20" fill="#c58b65"/>';$('patches').setAttribute('d',cat?'M49 78 Q65 38 99 43 L111 72 Z M136 43 Q169 42 189 79 L151 81 Z':'');$('patches').setAttribute('fill',cat?'#e6a76b':'none');for(let id of ['scarf','apron','hat','bow'])$(id).style.display=(id===$('outfit').value||id===$('headwear').value)?'':'none'}function animate(){const a=$('action').value;$('character').setAttribute('class',a==='idle'?'':a);$('food').style.display=a==='eat'?'':'none';if(a==='sleep')$('expression').value='sleepy';express()}function express(){let e=$('expression').value;$('eyeL').setAttribute('r',e==='surprised'?9:e==='sleepy'?2:7);$('eyeR').setAttribute('r',e==='surprised'?9:e==='sleepy'?2:7);$('mouth').setAttribute('d',e==='surprised'?'M114 138 Q120 161 126 138 Z':e==='sleepy'?'M112 142 Q120 139 128 142':'M110 138 Q120 150 130 138')}for(let id of ['species','outfit','headwear'])$(id).addEventListener('change',update);$('action').addEventListener('change',animate);$('expression').addEventListener('change',express);update();animate()</script></body></html>
