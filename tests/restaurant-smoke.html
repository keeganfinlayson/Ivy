const LOCATIONS=Object.freeze({entrance:{x:.09,y:.69},waiting:{x:.645,y:.855},bench:{x:.24,y:.82},counter:{x:.79,y:.855}});
const STATES=Object.freeze({ENTERING:'entering',WAITING:'waiting',WALKING:'walking',SEATED:'seated',SLEEPING:'sleeping',AT_COUNTER:'at_counter',IN_KITCHEN:'in_kitchen',EATING:'eating',LEAVING:'leaving'});
const allowed={entering:['walking'],waiting:['walking','seated','sleeping'],walking:['waiting','seated','sleeping','at_counter','leaving'],seated:['walking','sleeping'],sleeping:['walking','seated'],at_counter:['walking','in_kitchen','eating'],in_kitchen:['at_counter','eating'],eating:['leaving','at_counter'],leaving:[]};
class EventBus{constructor(){this.listeners=new Map()}on(name,fn){if(!this.listeners.has(name))this.listeners.set(name,new Set());this.listeners.get(name).add(fn);return()=>this.listeners.get(name)?.delete(fn)}emit(name,data){for(const fn of this.listeners.get(name)||[])fn(data)}}
class Customer{constructor({id,species='capybara',outfit='none',headwear='none',position=LOCATIONS.entrance,state=STATES.ENTERING}={}){if(!CUSTOMER_TYPES[species])throw Error('Unknown species');this.id=id||('customer-'+Date.now());this.species=species;this.outfit=outfit;this.headwear=headwear;this.position={...position};this.state=state}transition(next){if(!allowed[this.state]?.includes(next))throw Error('Invalid customer transition: '+this.state+' → '+next);this.state=next}serialize(){return{id:this.id,species:this.species,outfit:this.outfit,headwear:this.headwear,position:{...this.position},state:this.state}}}
class Game{constructor(){this.events=new EventBus();this.customers=new Map();this.coins=0;this.unlocked={ingredients:['strawberry','blueberry','banana','flour','sugar','milk'],customers:[],furniture:[],wallpaper:[],tools:[]};this.achievements=[];this.decorations=[];this.daily={lastGift:null,lastInspection:null};this.nextId=1}
addCustomer(species='capybara'){const c=new Customer({id:'customer-'+this.nextId++,species});this.customers.set(c.id,c);this.events.emit('customer:added',c);return c}
moveCustomer(id,destination,arrivalState){const c=this.customers.get(id);if(!c||!LOCATIONS[destination])return false;if(c.state!==STATES.WALKING)c.transition(STATES.WALKING);this.events.emit('customer:moving',{customer:c,destination:LOCATIONS[destination],arrivalState});return true}
arrive(id,position,state){const c=this.customers.get(id);if(!c)return;c.position={...position};c.transition(state);this.events.emit('customer:arrived',c)}
awardCoins(amount,reason){if(!Number.isInteger(amount))throw Error('Coin change must be an integer');this.coins=Math.max(0,this.coins+amount);this.events.emit('coins:changed',{coins:this.coins,amount,reason})}
snapshot(){return{version:SAVE_VERSION,coins:this.coins,unlocked:this.unlocked,achievements:this.achievements,decorations:this.decorations,daily:this.daily,nextId:this.nextId,customers:[...this.customers.values()].map(c=>c.serialize())}}
save(){try{localStorage.setItem('mochi-munch-save',JSON.stringify(this.snapshot()));this.events.emit('game:saved',{}) ;return true}catch(e){this.events.emit('game:save-error',e);return false}}
load(){try{const raw=localStorage.getItem('mochi-munch-save');if(!raw)return false;const data=JSON.parse(raw);if(data.version!==SAVE_VERSION)return false;this.coins=Number.isInteger(data.coins)?Math.max(0,data.coins):0;this.unlocked=data.unlocked||this.unlocked;this.achievements=Array.isArray(data.achievements)?data.achievements:[];this.decorations=Array.isArray(data.decorations)?data.decorations:[];this.daily=data.daily||this.daily;this.nextId=Number.isInteger(data.nextId)?data.nextId:1;this.customers.clear();for(const c of data.customers||[]){if(CUSTOMER_TYPES[c.species]&&allowed[c.state])this.customers.set(c.id,new Customer(c))}this.events.emit('game:loaded',this.snapshot());return true}catch(e){this.events.emit('game:load-error',e);return false}}}
function resolveRecipe(ingredients,method='mix'){const ids=[...ingredients].sort();const key=ids.join('+')+'|'+method;const recipes={'milk+strawberry+sugar|mix':{id:'strawberry-smoothie',name:'Strawberry Smoothie',quality:5},'flour+milk+sugar|bake':{id:'plain-muffin',name:'Plain Muffin',quality:4}};return recipes[key]||{id:'mystery-'+ids.join('-')+'-'+method,name:method==='bake'?'Mystery Bake':'Mystery Mix',quality:2}}

const RECIPE_CATALOG=Object.freeze(dishes.map(r=>Object.freeze({...r,needs:Object.freeze([...r.needs])})));
function hashKey(value){let n=2166136261;for(let i=0;i<value.length;i++){n^=value.charCodeAt(i);n=Math.imul(n,16777619)}return n>>>0}
function resolveFood(ingredients,method){
 if(!['mix','bake'].includes(method))throw Error('Unknown cooking method');
 if(!Array.isArray(ingredients)||ingredients.length<1||ingredients.length>4)throw Error('Choose 1–4 ingredients');
 const valid=new Set(INGREDIENTS.map(i=>i.id));if(ingredients.some(x=>!valid.has(x)))throw Error('Unknown ingredient');
 const counts=new Map();for(const i of ingredients)counts.set(i,(counts.get(i)||0)+1);
 if(counts.has('dragonfruit'))return {id:method==='bake'?'dragonfruit-cake':'dragonfruit-delight',name:method==='bake'?'Dragonfruit Magic Cake':'Dragonfruit Delight',emoji:method==='bake'?'🎂':'🍧',quality:5,group:'special'};
 const matches=RECIPE_CATALOG.filter(r=>r.method===method&&r.needs.every(x=>counts.has(x)))
 .map(r=>({r,extra:ingredients.length-r.needs.length})).filter(x=>x.extra>=0)
 .sort((a,b)=>a.extra-b.extra||b.r.needs.length-a.r.needs.length);
 if(matches.length){const d=matches[0];return {id:d.r.id,name:d.r.name,emoji:d.r.emoji,quality:Math.max(1,d.r.quality-(d.extra>=2?1:0)),group:d.r.group}}
 const seed=[...ingredients].sort().join('+')+'|'+method,hash=hashKey(seed);
 const names=method==='bake'?['Wobbly Cake','Mystery Crumble','Surprise Puff','Curious Biscuit']:['Rainbow Goo','Silly Smoothie','Mystery Mousse','Wiggle Pudding'];
 return{id:'mystery-'+hash.toString(36),name:names[hash%names.length],emoji:method==='bake'?'🥧':'🍮',quality:1+hash%3,group:method==='bake'?'baked':'other'};
}
function rateFood(food,preference){
 if(food.group==='special')return 5;
 let n=food.quality;
 if(preference==='fruit'&&food.group==='fruit')n++;
 if(preference==='baked'&&food.group==='baked')n++;
 if(preference==='fruit'&&food.group==='baked')n--;
 if(preference==='baked'&&food.group==='fruit')n--;
 return Math.max(1,Math.min(5,n));
}

function eventSpecies(date=new Date(),random=Math.random){
 const m=date.getMonth();

}

/* Mochi Munch v0.16: world layout, clear queue lane, and camera geometry. */
const WORLD_WIDTH=1660;
const LINE_SPOTS=Object.freeze([
 Object.freeze({x:.57,y:.855}),
 Object.freeze({x:.47,y:.855}),
 Object.freeze({x:.37,y:.855})
]);
// The floor corridor is reserved for customers. Furniture is kept to its perimeter.
const LINE_CORRIDOR=Object.freeze({left:.32,right:.86,top:.675,bottom:.96});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function isInLineCorridor(x,y){
 const main=x>=LINE_CORRIDOR.left&&x<=LINE_CORRIDOR.right&&y>=LINE_CORRIDOR.top&&y<=LINE_CORRIDOR.bottom;
 const entry=x>=.06&&x<.32&&y>=.63&&y<=.77;
 const bench=x>=.17&&x<=.33&&y>=.79&&y<=.94;
 return main||entry||bench;
}
function safeFurniturePosition(x,y){
 if(!Number.isFinite(x)||!Number.isFinite(y))throw Error('Invalid furniture position');
 let xx=clamp(x,.06,.94), yy=clamp(y,.37,.92);
 // Keep the furniture away from both the standing line and its walking corridor.
 if(isInLineCorridor(xx,yy)){
  const choices=[
   {x:xx,y:.62,cost:Math.abs(yy-.62)},
   {x:.115,y:yy,cost:Math.abs(xx-.115)*1.4},
   {x:.905,y:yy,cost:Math.abs(xx-.905)*1.4}
  ].filter(p=>!isInLineCorridor(p.x,p.y)).sort((a,b)=>a.cost-b.cost);
  xx=choices[0]?.x??.90;yy=choices[0]?.y??.60;
 }
 return {x:xx,y:yy};
}
function routeFor(start,destination){
 // Customers walk along a corridor behind the line, rather than through standing guests.
 if(destination==='waiting'){
  // Following visits advance from the front of the existing line.
  if(start.x>=.35&&start.y>=.78)return [{x:.645,y:.855}];
  return [{x:.18,y:.69},{x:.645,y:.69},{x:.645,y:.855}];
 }
 if(destination==='bench'){
  return [{x:start.x,y:.69},{x:.24,y:.69},{x:.24,y:.82}];
 }
 if(destination==='counter'){
  if(start.x<.4||start.y<.75)return [{x:start.x,y:.69},{x:.73,y:.69},{x:.79,y:.855}];
  return [{x:.79,y:.855}];
 }
 if(destination==='entrance'){
  return [{x:.79,y:.69},{x:.18,y:.69},{x:.09,y:.69}];
 }
 return [];
}
function cameraPosition(worldX,worldWidth,viewportWidth){
 if(!Number.isFinite(worldWidth)||!Number.isFinite(viewportWidth)||worldWidth<=0||viewportWidth<=0)return 0;
 return clamp(worldX*worldWidth-viewportWidth*.56,0,Math.max(0,worldWidth-viewportWidth));
}
function distanceAlongRoute(start,route,width,height){
 let d=0,prev=start;for(const point of route){d+=Math.hypot((point.x-prev.x)*width,(point.y-prev.y)*height);prev=point}
 return d;
}

/* Mochi Munch restaurant session engine v3: shops, celebrations and guest events. */




const SAVE_KEY='mochi-munch-game';
const SESSION_VERSION=4;
const validIngredients=new Set(INGREDIENTS.map(x=>x.id));
const validPhases=new Set(['arriving','waiting','moving','counter','prepared','finished','leaving']);
const validStates=new Set(Object.values(STATES));
function clampInt(v,def=0){return Number.isSafeInteger(v)&&v>=0?v:def}
class Restaurant{
 constructor(saved=null,{random=Math.random}={}){
   this.random=random;this.now=()=>new Date();this.game=new Game();this.currentId=null;this.queueIds=[];this.phase='arriving';this.scene='cafe';this.selected=[];this.cooking=null;this.prepared=null;this.served=0;this.lastReward=0;this.lastRating=null;this.pendingMove=null;this.wallpaper='default';this.lastBonuses=[];this.cameFromLine=false;
   if(!saved||!this.restore(saved)){this.fillQueue();this.startNext()}
 }
 get customer(){return this.game.customers.get(this.currentId)||null}
 get queue(){return this.queueIds.map(id=>this.game.customers.get(id)).filter(Boolean)}
 createGuest(){
  const pool=['cat','capybara',...this.game.unlocked.customers.filter(id=>['dog','otter','giraffe'].includes(id))];
  const roll=this.random();let type;
  if(roll<.025)type='unicorn-cat';
  else if(roll<.13)type=eventSpecies(this.now(),this.random)||pool[Math.floor(this.random()*pool.length)];
  else type=pool[Math.floor(this.random()*pool.length)];
  const c=this.game.addCustomer(type);c.rarity=SPECIES[type]?.rarity||'common';c.preference=this.random()<.5?'fruit':'baked';return c;
 }
 fillQueue(){while(this.queueIds.length<3)this.queueIds.push(this.createGuest().id)}
 startNext(){
  if(this.currentId)throw Error('Finish the current visit first');
  this.fillQueue();
  const now=this.now(),today=dateKey(now),inspectorDue=now.getDay()===5&&this.game.daily.lastInspection!==today;
  if(inspectorDue){const c=this.game.addCustomer('inspector-cat');c.preference='baked';c.rarity='inspector';this.currentId=c.id;this.cameFromLine=false}
  else {this.cameFromLine=this.served>0;this.currentId=this.queueIds.shift()}
  this.fillQueue();
  const c=this.customer;c.position={...(this.cameFromLine?LINE_SPOTS[0]:LOCATIONS.entrance)};c.state=STATES.ENTERING;
  this.phase='arriving';this.scene='cafe';this.cooking=null;this.prepared=null;this.selected=[];this.lastRating=null;this.lastReward=0;this.lastBonuses=[];this.pendingMove=null;return c;
 }
 planMove(destination,arrivalState){
   if(this.pendingMove)throw Error('Customer is already moving');
   if(!LOCATIONS[destination])throw Error('Unknown destination');
   if(destination==='waiting'&&this.phase!=='arriving')throw Error('Only new guests enter the waiting area');
   if(destination==='counter'&&!['waiting','counter'].includes(this.phase))throw Error('Customer cannot approach now');
   if(destination==='bench'&&this.phase!=='waiting')throw Error('Customer cannot go to the bench now');
   const c=this.customer;if(!c)throw Error('No active customer');
   this.game.moveCustomer(c.id,destination,arrivalState);
   this.pendingMove={destination,arrivalState};this.phase='moving';
   return {...LOCATIONS[destination]};
 }
 finishMove(){if(this.phase!=='moving'||!this.pendingMove)throw Error('No move to finish');const {destination,arrivalState}=this.pendingMove;this.game.arrive(this.currentId,LOCATIONS[destination],arrivalState);this.pendingMove=null;this.phase=arrivalState===STATES.AT_COUNTER?'counter':'waiting';return this.customer}
 sit(){if(this.phase!=='waiting')throw Error('Customer is not waiting');if(this.customer.state===STATES.SLEEPING){this.customer.transition(STATES.SEATED);return null}return this.planMove('bench',STATES.SEATED)}
 nap(){if(this.phase!=='waiting')throw Error('Customer is not waiting');if(this.customer.state===STATES.SEATED){this.customer.transition(STATES.SLEEPING);return null}return this.planMove('bench',STATES.SLEEPING)}
 toCounter(){return this.planMove('counter',STATES.AT_COUNTER)}
 openKitchen(){if(this.phase!=='counter')throw Error('Serve this customer before returning to the kitchen');this.scene='kitchen'}
 returnCafe(){this.scene='cafe'}
 addIngredient(id){if(this.scene!=='kitchen'||this.phase!=='counter'||this.cooking)throw Error('The bowl is not available');if(!validIngredients.has(id))throw Error('Unknown ingredient');if(!this.game.unlocked.ingredients.includes(id))throw Error('Unlock this ingredient in the shop');if(this.selected.length>=4)throw Error('The bowl holds four ingredients');this.selected.push(id)}
 clearIngredients(){if(this.cooking)throw Error('Finish cooking before emptying the bowl');this.selected=[]}
 startMix(){this.checkCook();this.cooking={method:'mix',stirs:0,stirsNeeded:this.hasTool('fast-mixer')?1:3};return this.cooking}
 stir(){if(this.cooking?.method!=='mix')throw Error('Start mixing first');this.cooking.stirs++;if(this.cooking.stirs>=(this.cooking.stirsNeeded||3))return this.completeCook();return null}
 startBake(now=Date.now()){this.checkCook();this.cooking={method:'bake',startedAt:now,duration:this.hasTool('sparkly-oven')?900:1800};return this.cooking}
 ovenReady(now=Date.now()){return this.cooking?.method==='bake'&&now-this.cooking.startedAt>=(this.cooking.duration||1800)}
 openOven(now=Date.now()){if(!this.ovenReady(now))throw Error('The oven is still baking');return this.completeCook()}
 checkCook(){if(this.scene!=='kitchen'||this.phase!=='counter'||this.cooking||!this.selected.length)throw Error('Choose ingredients before cooking')}
 completeCook(){const food=resolveFood(this.selected,this.cooking.method),stars=rateFood(food,this.customer.preference);this.prepared={...food,stars,method:this.cooking.method,ingredients:[...this.selected]};this.cooking=null;this.phase='prepared';return this.prepared}
 bringFood(){if(this.phase!=='prepared'||!this.prepared)throw Error('Food is not ready');this.scene='cafe'}

  if(this.scene!=='cafe'||this.phase!=='prepared'||!this.prepared)throw Error('No food ready to serve');
  const c=this.customer;c.transition(STATES.EATING);this.lastRating=this.prepared.stars;
  const rarity=c.rarity||SPECIES[c.species]?.rarity||'common';
  this.lastReward=rarity==='inspector'&&this.lastRating===5?30:rarity==='inspector'&&this.lastRating===1?-1:rarity==='rare'&&this.lastRating===5?50:REWARDS[this.lastRating];
  this.game.awardCoins(this.lastReward,'customer rating');
  if(rarity==='inspector')this.game.daily.lastInspection=dateKey(this.now());
  this.served++;this.phase='finished';this.lastBonuses=[];
  for(const milestone of ACHIEVEMENTS){
   if(this.served>=milestone.at&&!this.game.achievements.includes(milestone.id)){
    this.game.achievements.push(milestone.id);this.game.awardCoins(5,'achievement');
    this.lastBonuses.push({name:milestone.name,amount:5});
   }
  }
  return {stars:this.lastRating,reward:this.lastReward,bonuses:[...this.lastBonuses],food:this.prepared,special:rarity};
 }
 beginLeave(){if(this.phase!=='finished')throw Error('Customer is still eating or waiting');this.customer.transition(STATES.LEAVING);this.phase='leaving';return {...LOCATIONS.entrance}}

 hasTool(id){return this.game.unlocked.tools.includes(id)}

  const item=itemById(id);if(!item)throw Error('Unknown shop item');

  if(bag.includes(id))throw Error('You already own this item');
  if(this.game.coins<item.price)throw Error('You need '+(item.price-this.game.coins)+' more coins');
  this.game.awardCoins(-item.price,'shop purchase');bag.push(id);
  if(item.kind==='wallpaper')this.wallpaper=id;
  if(item.kind==='furniture'){
   const count=this.game.decorations.length;
   const safe=safeFurniturePosition(.16+(count%3)*.065,.51+Math.floor(count/3)*.11);

  }
  return item;
 }

  if(!this.game.unlocked.furniture.includes(id))throw Error('Buy this furniture first');
  if(!FURNITURE_COLORS.some(c=>c.id===color))throw Error('Unknown color');
  if(!Number.isFinite(x)||!Number.isFinite(y))throw Error('Invalid furniture position');
  const item=this.game.decorations.find(d=>d.id===id);
  if(!item)throw Error('Furniture not found');

  item.x=safe.x;item.y=safe.y;item.color=color;
  return item;
 }
 claimDaily(date=this.now()){
  const day=dateKey(date);
  if(this.game.daily.lastGift===day)throw Error('Today’s gift has already been opened');

 }

 serialize(){
  const details=Object.fromEntries([...this.game.customers.values()].map(c=>[c.id,{preference:c.preference,rarity:c.rarity}]));
  return {version:SESSION_VERSION,game:this.game.snapshot(),details,currentId:this.currentId,queueIds:[...this.queueIds],phase:this.phase,scene:this.scene,selected:[...this.selected],cooking:this.cooking?{...this.cooking}:null,prepared:this.prepared?{...this.prepared,ingredients:[...this.prepared.ingredients]}:null,served:this.served,lastRating:this.lastRating,lastReward:this.lastReward,lastBonuses:[...this.lastBonuses],wallpaper:this.wallpaper,cameFromLine:this.cameFromLine,pendingMove:this.pendingMove?{...this.pendingMove}:null};

 restore(raw){try{
  if(!raw||![2,3,4].includes(raw.version)||!raw.game||!Array.isArray(raw.game.customers))return false;
  const customers=new Map();

  if(!customers.has(raw.currentId)||!Array.isArray(raw.queueIds)||raw.queueIds.some(id=>!customers.has(id)||id===raw.currentId))return false;
  this.game.customers=customers;this.game.coins=clampInt(raw.game.coins);this.game.nextId=clampInt(raw.game.nextId,1);
  const unlock=raw.game.unlocked||{};
  this.game.unlocked={
   ingredients:[...new Set(['strawberry','blueberry','banana','flour','sugar','milk',...(Array.isArray(unlock.ingredients)?unlock.ingredients:[])])].filter(id=>validIngredients.has(id)),
   customers:(Array.isArray(unlock.customers)?unlock.customers:[]).filter(x=>['dog','otter','giraffe'].includes(x)),
   furniture:(Array.isArray(unlock.furniture)?unlock.furniture:[]).filter(id=>itemById(id)?.kind==='furniture'),
   wallpaper:(Array.isArray(unlock.wallpaper)?unlock.wallpaper:[]).filter(id=>itemById(id)?.kind==='wallpaper'),
   tools:(Array.isArray(unlock.tools)?unlock.tools:[]).filter(id=>itemById(id)?.kind==='tools')
  };
  this.game.achievements=Array.isArray(raw.game.achievements)?raw.game.achievements:[];
  this.game.decorations=Array.isArray(raw.game.decorations)?raw.game.decorations.filter(d=>this.game.unlocked.furniture.includes(d.id)).map(d=>({...d,...safeFurniturePosition(d.x,d.y)})):[];
  this.game.daily=raw.game.daily||this.game.daily;
  this.currentId=raw.currentId;this.queueIds=[...new Set(raw.queueIds)];this.phase=validPhases.has(raw.phase)?raw.phase:'waiting';
  this.scene=raw.scene==='kitchen'?'kitchen':'cafe';this.selected=Array.isArray(raw.selected)?raw.selected.filter(x=>validIngredients.has(x)).slice(0,4):[];
  this.cooking=raw.cooking&&['mix','bake'].includes(raw.cooking.method)?{...raw.cooking}:null;
  this.prepared=raw.prepared&&Number.isInteger(raw.prepared.stars)?raw.prepared:null;
  this.served=clampInt(raw.served);this.lastRating=raw.lastRating||null;this.lastReward=Number.isInteger(raw.lastReward)?raw.lastReward:0;this.lastBonuses=Array.isArray(raw.lastBonuses)?raw.lastBonuses:[];this.wallpaper=this.game.unlocked.wallpaper.includes(raw.wallpaper)?raw.wallpaper:'default';
  this.pendingMove=raw.pendingMove||null;this.cameFromLine=raw.version>=4&&!!raw.cameFromLine;
  // Resume interrupted movement at its starting location or complete it safely.
  if(this.phase==='moving'){const p=this.pendingMove;if(p&&LOCATIONS[p.destination]&&validStates.has(p.arrivalState)){this.game.arrive(this.currentId,LOCATIONS[p.destination],p.arrivalState);this.phase=p.arrivalState===STATES.AT_COUNTER?'counter':'waiting'}else{this.customer.state=STATES.WAITING;this.phase='waiting'}this.pendingMove=null}
  if(this.phase==='leaving'){this.game.customers.delete(this.currentId);this.currentId=null;this.startNext()}
  if(this.phase==='finished')this.customer.state=STATES.EATING;
  if(this.phase==='prepared'&&!this.prepared){this.phase='counter';this.scene='kitchen'}
  if(this.phase==='counter'||this.phase==='prepared')this.customer.state=STATES.AT_COUNTER;
  if(this.phase==='arriving'){this.customer.state=STATES.ENTERING;this.customer.position={...(this.cameFromLine?LINE_SPOTS[0]:LOCATIONS.entrance)}}
  // Old saved positions belong to the earlier single-screen room.
  // Reposition the same guest in the new wide room without resetting their progress.
  if(raw.version<4&&this.customer){
   if(['counter','prepared','finished'].includes(this.phase))this.customer.position={...LOCATIONS.counter};
   else if(this.phase==='waiting'){

   }
  }
  this.fillQueue();return true
 }catch{return false}}
}

const checks=[];
function test(title,fn){try{fn();checks.push({title,pass:true})}catch(e){checks.push({title,pass:false,error:e.message})}}
function ensure(x,message){if(!x)throw Error(message)}
function arrive(r){if(r.phase==='arriving'){r.planMove('waiting',STATES.WAITING);r.finishMove()}ensure(r.phase==='waiting','not waiting')}
function toCounter(r){r.toCounter();r.finishMove();ensure(r.phase==='counter','not at counter')}
function mix(r,items){r.openKitchen();for(const id of items)r.addIngredient(id);r.startMix();while(r.cooking?.method==='mix')r.stir();r.bringFood()}
function bake(r,items){r.openKitchen();for(const id of items)r.addIngredient(id);r.startBake(1000);r.openOven(3500);r.bringFood()}
function runCustomer(r,index){arrive(r);if(index%3===0){r.sit();r.finishMove();r.nap()}toCounter(r);if(index%2===0)mix(r,['strawberry','milk']);else bake(r,['flour','sugar']);const result=r.serve();r.beginLeave();r.finishLeave();return result}

test('Fifty consecutive customers, including sitting and napping',()=>{
 const r=new Restaurant(null,{random:()=>.7});
 for(let i=0;i<50;i++)runCustomer(r,i);
 ensure(r.served===50,'fewer than fifty served');
 ensure(r.game.achievements.includes('fifty-customers'),'fifty celebration not awarded');
 ensure(r.game.coins>0,'no coins earned')
});
test('Duplicate serving and repeated purchases are blocked',()=>{
 const r=new Restaurant(null,{random:()=>.7});arrive(r);toCounter(r);mix(r,['strawberry','milk']);r.serve();const before=r.game.coins;
 let blocked=false;try{r.serve()}catch{blocked=true}
 ensure(blocked&&before===r.game.coins,'double serving gave coins');
 r.game.coins+=300;r.purchase('mango');const after=r.game.coins;blocked=false;try{r.purchase('mango')}catch{blocked=true}
 ensure(blocked&&after===r.game.coins,'duplicate purchase charged money')
});

});

 c.openOven(3000);const d=new Restaurant(c.serialize());ensure(d.phase==='prepared'&&d.prepared,'dish lost');
 d.bringFood();d.serve();const e=new Restaurant(d.serialize());
 ensure(e.phase==='finished'&&e.customer.state===STATES.EATING,'eating state lost');
 e.beginLeave();e.finishLeave();ensure(e.phase==='arriving','next visit failed')
});
test('Interrupted customer movement restores without a crash',()=>{
 const r=new Restaurant();r.planMove('waiting',STATES.WAITING);const copy=new Restaurant(r.serialize());
 ensure(copy.phase==='waiting'&&copy.customer.state===STATES.WAITING,'interrupted move not recovered')
});
test('Version-two saved restaurants migrate without losing coins',()=>{
 const r=new Restaurant();r.game.coins=137;const old=r.serialize();old.version=2;delete old.wallpaper;const copy=new Restaurant(old);
 ensure(copy.game.coins===137,'old save lost coins')
});

test('A visible queue advances one person after each meal',()=>{
 const r=new Restaurant(null,{random:()=>.8});const front=r.queueIds[0];
 arrive(r);toCounter(r);mix(r,['strawberry','milk']);r.serve();r.beginLeave();r.finishLeave();
 ensure(r.currentId===front,'previous queue front was not promoted');
 ensure(r.cameFromLine&&r.customer.position.x===LINE_SPOTS[0].x,'next customer started at wrong place');
 arrive(r);ensure(r.customer.position.x===LOCATIONS.waiting.x,'next guest failed to step forward')
});
test('Entry, queue and bench routes remain unobstructed',()=>{
 for(const p of [[.6,.85],[.45,.70],[.20,.70],[.24,.84]]){
  ensure(isInLineCorridor(...p),'missing reserved route');
  const safe=safeFurniturePosition(...p);
  ensure(!isInLineCorridor(safe.x,safe.y),'furniture can block the route');
 }
 const arrival=routeFor(LOCATIONS.entrance,'waiting'),exit=routeFor(LOCATIONS.counter,'entrance');
 ensure(arrival.length===3&&arrival.at(-1).x===LOCATIONS.waiting.x,'wrong arrival path');
 ensure(exit.length===3,'wrong exit path')
});
test('Wide-scene camera clamps to the scrollable area',()=>{
 ensure(cameraPosition(.01,1660,800)===0,'left overflow');
 ensure(cameraPosition(.99,1660,800)<=860,'right overflow');
 ensure(cameraPosition(.74,1660,800)>0,'camera never follows customer')
});
test('Older saved positions migrate without losing coins',()=>{
 const r=new Restaurant();r.game.coins=143;
 const saved=r.serialize();saved.version=3;saved.phase='waiting';
 saved.game.customers.find(c=>c.id===saved.currentId).position={x:.27,y:.77};
 const restored=new Restaurant(saved);
 ensure(restored.game.coins===143,'coins missing');
 ensure(restored.customer.position.x===LOCATIONS.waiting.x,'wrong restored position')
});

test('Illustrated animals keep expressive head, limb and clothing layers',()=>{
 for(const species of ['capybara','cat','dog','otter','giraffe','unicorn-cat','inspector-cat','turkey','ghost','santa-capybara']){
  const svg=characterSVG({id:'smoke-'+species,species,outfit:'apron',headwear:'chef'},'idle');
  ensure(svg.includes('class="head"')&&svg.includes('class="arm arm-left"')&&svg.includes('class="legs"'),'missing limbs in '+species);
  ensure(svg.includes('class="chef-hat"'),'hat not modular in '+species);
 }
});
test('Tasting pauses before expressive reactions',()=>{
 const a=characterSVG({id:'taste',species:'capybara',outfit:'scarf',headwear:'none'},'yuck');
 ensure(a.includes('class="tasting-features"')&&a.includes('class="reaction-features"'),'two acting faces missing')
});

});
