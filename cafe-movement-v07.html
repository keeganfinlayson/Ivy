<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mochi Munch Café v0.7</title><style>*{box-sizing:border-box}body{margin:0;background:#fff3f7;color:#604355;font:16px system-ui,sans-serif}header{background:#ffe0eb;padding:15px 22px}h1{margin:0;font-size:1.5rem}main{max-width:1000px;margin:auto;padding:16px}.cafe{height:510px;position:relative;overflow:hidden;border:6px solid #dca8ba;border-radius:24px;background:linear-gradient(#ffe5ef 0 73%,#dcbfa9 73%);touch-action:manipulation}.window{position:absolute;top:40px;left:40px;width:155px;height:155px;background:linear-gradient(#b9e8fc,#e3f8ff);border:12px solid white;border-radius:18px;box-shadow:0 5px #d6b4bd}.window:after{content:"";position:absolute;left:60px;top:0;bottom:0;border-left:8px solid white}.counter{position:absolute;right:25px;bottom:30px;width:36%;height:110px;background:#f2b1c7;border:7px solid #b97990;border-radius:18px;box-shadow:inset 0 15px #ffe2ea;display:grid;place-items:center;font-weight:800;letter-spacing:2px}.bench{position:absolute;left:15%;bottom:90px;width:190px;height:70px;border-radius:20px;background:#f3c0d1;border:6px solid #be8da1}.bench:after{content:"";position:absolute;left:20px;right:20px;bottom:-30px;height:30px;border-left:10px solid #a77789;border-right:10px solid #a77789}.door{position:absolute;left:8px;bottom:27%;width:83px;height:160px;background:#fff8fa;border:6px solid #cc9aaa;border-radius:50px 50px 0 0;text-align:center;padding-top:60px;font-size:12px}.animal{position:absolute;width:100px;height:120px;transform:translate(-50%,-100%);transition:none;pointer-events:none;filter:drop-shadow(0 5px 2px #0002)}.animal svg{width:100%;height:100%;overflow:visible}.animal.walk .legs{animation:stride .26s ease-in-out infinite alternate;transform-origin:50% 70%}.animal.walk .arms{animation:swing .26s ease-in-out infinite alternate;transform-origin:50% 50%}.animal.walk svg{animation:bob .26s ease-in-out infinite alternate}.animal.sit svg{transform:scaleY(.82);transform-origin:50% 100%}.animal.sleep svg{animation:breathe 2s ease-in-out infinite alternate}@keyframes stride{to{transform:skewX(12deg)}}@keyframes swing{to{transform:rotate(8deg)}}@keyframes bob{to{transform:translateY(-4px)}}@keyframes breathe{to{transform:scaleY(.97)}}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.controls button,.controls select{font:inherit;padding:10px 14px;border:2px solid #d9a3b6;border-radius:12px;background:white;color:#604355;cursor:pointer}.controls button:hover{background:#ffe2ec}.status{padding:14px;border-radius:14px;background:white;min-height:50px}.note{font-size:.88rem;color:#806776} @media(max-width:600px){.cafe{height:400px}.bench{left:15%;width:130px}.counter{width:39%;font-size:12px}.animal{width:82px;height:100px}}</style></head><body><header><h1>🍓 Mochi Munch — Café Movement v0.7</h1></header><main><div class="controls"><button id="arrive">New customer arrives</button><button id="counterBtn">Go to counter</button><button id="seatBtn">Sit in waiting room</button><button id="sleepBtn">Take a nap</button><label>Customer <select id="species"><option value="capybara">Capybara</option><option value="cat">Calico cat</option></select></label><label>Outfit <select id="outfit"><option value="none">None</option><option value="scarf">Scarf</option><option value="apron">Apron</option></select></label><label>Hat <select id="hat"><option value="none">None</option><option value="chef">Chef hat</option><option value="bow">Bow</option></select></label></div><section class="cafe" id="cafe" aria-label="Café room"><div class="window"></div><div class="door">ENTRY</div><div class="bench"></div><div class="counter">COUNTER</div><div class="animal" id="animal"></div></section><p class="status" id="status" aria-live="polite">Customer waiting. Select a destination to see actual movement across the room.</p><p class="note">This build separates customer state and movement from rendering. Customer position and outfit are saved locally. Cooking and shop interfaces are planned.</p></main><script type="module">
import {Game,STATES,LOCATIONS} from './src/game-core.js';const game=new Game();const $=id=>document.getElementById(id),cafe=$('cafe'),animal=$('animal'),status=$('status');let pos={x:.26,y:.77},motion=null,mode='idle';let current=game.addCustomer('capybara');current.state=STATES.WAITING;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function art(){let cat=current.species==='cat',fur=cat?'#fff9f3':'#dba776',outline='#704c40',scarf=current.outfit==='scarf',apron=current.outfit==='apron',hat=current.headwear==='chef',bow=current.headwear==='bow';return '<svg viewBox="0 0 120 145" xmlns="http://www.w3.org/2000/svg"><g stroke="'+outline+'" stroke-width="3" stroke-linejoin="round"><g class="legs"><ellipse cx="40" cy="126" rx="13" ry="17" fill="'+fur+'"/><ellipse cx="80" cy="126" rx="13" ry="17" fill="'+fur+'"/></g><ellipse cx="60" cy="99" rx="37" ry="37" fill="'+fur+'"/><g class="arms"><ellipse cx="23" cy="101" rx="11" ry="21" fill="'+fur+'"/><ellipse cx="97" cy="101" rx="11" ry="21" fill="'+fur+'"/></g>'+(cat?'<path d="M17 51 L20 8 L45 28 Q60 20 75 28 L101 8 L103 51" fill="'+fur+'"/><path d="M25 21 L27 41 L40 31 M95 21 L93 41 L80 31" fill="#f5b8c5" stroke="none"/>':'<circle cx="24" cy="43" r="13" fill="#c48a62"/><circle cx="96" cy="43" r="13" fill="#c48a62"/>')+'<ellipse cx="60" cy="63" rx="48" ry="43" fill="'+fur+'"/>'+(cat?'<path d="M18 45 Q34 22 52 35 L56 53 L20 62 Z" fill="#e9a36c" stroke="none"/><path d="M73 33 Q93 25 102 52 L79 57 Z" fill="#a8a1b0" stroke="none"/>':'')+'<ellipse cx="60" cy="79" rx="25" ry="17" fill="#f7dfc9" stroke="none"/><circle cx="42" cy="60" r="4" fill="#382822" stroke="none"/><circle cx="79" cy="60" r="4" fill="#382822" stroke="none"/><ellipse cx="60" cy="74" rx="5" ry="4" fill="'+outline+'" stroke="none"/><path d="M53 83 Q60 91 67 83" fill="none" stroke-width="2"/>'+(scarf?'<path d="M28 93 Q60 110 92 93 L87 106 Q60 121 33 106 Z" fill="#f3a8c3"/><path d="M81 107 L99 128 L87 132 L72 114" fill="#f3a8c3"/>':'')+(apron?'<path d="M42 101 L78 101 L86 131 Q60 141 34 131 Z" fill="#ffe3ed"/>':'')+(hat?'<path d="M32 30 Q21 9 40 7 Q60 -5 78 7 Q99 11 88 30 Z" fill="#fff"/><rect x="31" y="27" width="58" height="10" rx="4" fill="#f4b4cb"/>':'')+(bow?'<path d="M85 36 Q107 16 110 38 Q113 56 89 44 Q68 58 72 39 Q76 26 85 36 Z" fill="#f3a8c3"/>':'')+'</g></svg>'}
function draw(){animal.innerHTML=art();animal.className='animal '+(mode==='walk'?'walk':mode==='sit'?'sit':mode==='sleep'?'sleep':'');place()}
function place(){animal.style.left=(pos.x*100)+'%';animal.style.top=(pos.y*100)+'%'}
function moveTo(x,y,finalMode,label,arrivalState){if(motion)cancelAnimationFrame(motion.frame);mode='walk';draw();const start={...pos},end={x:clamp(x,.12,.9),y:clamp(y,.34,.91)},distance=Math.hypot((end.x-start.x)*cafe.clientWidth,(end.y-start.y)*cafe.clientHeight),duration=Math.max(250,distance/115*1000);let t0=null;status.textContent=label;function step(t){if(t0===null)t0=t;let p=Math.min(1,(t-t0)/duration),ease=p*p*(3-2*p);pos.x=start.x+(end.x-start.x)*ease;pos.y=start.y+(end.y-start.y)*ease;current.position={...pos};place();if(p<1)motion.frame=requestAnimationFrame(step);else{motion=null;mode=finalMode;game.arrive(current.id,pos,arrivalState);draw();game.save();status.textContent=label+' — arrived.'}}motion={frame:requestAnimationFrame(step)}}
function stop(){if(motion){cancelAnimationFrame(motion.frame);motion=null}}
game.events.on('customer:moving',({destination,arrivalState})=>{const finalMode=arrivalState===STATES.SEATED?'sit':arrivalState===STATES.SLEEPING?'sleep':'idle';moveTo(destination.x,destination.y,finalMode,'Customer walking to '+(arrivalState===STATES.AT_COUNTER?'counter':'waiting area'),arrivalState)});
function navigate(dest,state){try{game.moveCustomer(current.id,dest,state)}catch(e){status.textContent=e.message}}
$('arrive').onclick=()=>{stop();game.customers.delete(current.id);current=game.addCustomer($('species').value);current.state=STATES.WAITING;pos={...LOCATIONS.entrance};current.position={...pos};mode='idle';draw();navigate('waiting',STATES.WAITING)};
$('counterBtn').onclick=()=>navigate('counter',STATES.AT_COUNTER);
$('seatBtn').onclick=()=>navigate('bench',STATES.SEATED);
$('sleepBtn').onclick=()=>navigate('bench',STATES.SLEEPING);
$('species').addEventListener('change',()=>{current.species=$('species').value;draw();game.save()});
$('outfit').addEventListener('change',()=>{current.outfit=$('outfit').value;draw();game.save()});
$('hat').addEventListener('change',()=>{current.headwear=$('hat').value;draw();game.save()});
if(game.load()&&game.customers.size){current=[...game.customers.values()][0];if(current.state===STATES.WALKING)current.state=STATES.WAITING;pos={...current.position};$('species').value=current.species;$('outfit').value=current.outfit;$('hat').value=current.headwear;mode=current.state===STATES.SEATED?'sit':current.state===STATES.SLEEPING?'sleep':'idle';status.textContent='Saved customer restored.'}
draw();</script></body></html>
